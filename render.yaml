# Optional Render Blueprint — you can also create the service only in the Render dashboard.
# New Blueprint: https://dashboard.render.com/select-repo?type=blueprint
#
# After first deploy, open your Web Service → Environment and set:
#   CORS_ORIGIN = your live Framer site (https://....)
#   HF_TOKEN    = from https://huggingface.co/settings/tokens

services:
  - type: web
    name: ai-image-gen-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: CORS_ORIGIN
        sync: false
      - key: HF_TOKEN
        sync: false
